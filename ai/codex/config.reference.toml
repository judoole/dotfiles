# Codex preferences — REFERENCE ONLY. This file is not symlinked anywhere.
#
# Codex rewrites ~/.codex/config.toml continuously (per-project trust levels,
# worktree mappings, marketplace cache timestamps, absolute app paths), so
# linking it into this repo would mean permanent git noise and would pin the
# old machine's paths onto the new one.
#
# On the new Mac: launch Codex once so it writes its own config, then merge
# these settings into it.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
service_tier = "default"

[features]
multi_agent = true
js_repl = false

[desktop]
followUpQueueMode = "steer"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-create-pull-request-as-draft = true
git-pull-request-merge-method = "squash"
git-show-sidebar-pr-icons = true
dock-icon-preference = "codex-system"

[desktop.open-in-target-preferences]
global = "vscode"

# Enabled plugins.
[plugins."canva@openai-curated"]
enabled = true
[plugins."github@openai-curated"]
enabled = true
[plugins."slack@openai-curated"]
enabled = true
[plugins."gmail@openai-curated"]
enabled = true
[plugins."google-drive@openai-curated"]
enabled = true
[plugins."documents@openai-primary-runtime"]
enabled = true
[plugins."spreadsheets@openai-primary-runtime"]
enabled = true
[plugins."presentations@openai-primary-runtime"]
enabled = true
[plugins."pdf@openai-primary-runtime"]
enabled = true
[plugins."template-creator@openai-primary-runtime"]
enabled = true
[plugins."computer-use@openai-bundled"]
enabled = true
[plugins."chrome@openai-bundled"]
enabled = true
[plugins."browser@openai-bundled"]
enabled = true
[plugins."visualize@openai-bundled"]
enabled = true
[plugins."sites@openai-bundled"]
enabled = true
